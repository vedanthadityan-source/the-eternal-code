<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a2433; font-family: Georgia, serif; color: #d8eaf4; overflow: hidden; }
  .admin { display: flex; gap: 12px; align-items: center; }
  .avatar-wrap { position: relative; display: inline-block; }
  .avatar-wrap a { display: block; }
  .avatar-border {
    width: 54px; height: 54px; border-radius: 4px;
    border: 2px solid #3ecf5a; padding: 2px; box-sizing: border-box;
  }
  .avatar-border img {
    width: 100%; height: 100%; border-radius: 2px; object-fit: cover; display: block;
  }
  .online-dot {
    position: absolute; bottom: 2px; right: 2px;
    width: 11px; height: 11px;
    background: #3ecf5a; border-radius: 50%; border: 2px solid #1a2433;
  }
</style>
</head>
<body>
<div class="admin">
  <div class="avatar-wrap">
    <a href="https://www.chess.com/member/tophalfofgojo" target="_blank" rel="noopener">
      <div class="avatar-border">
        <img src="https://images.chesscomfiles.com/uploads/v1/user/522054735.773529a4.50x50o.e4b274f70d42.jpg" />
      </div>
    </a>
    <div class="online-dot"></div>
  </div>
</div>
</body>
</html>
