<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a2433; font-family: Georgia, serif; color: #d8eaf4; overflow: hidden; }
  .admins { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .avatar-wrap { position: relative; display: inline-block; }
  .avatar-wrap a { display: block; }
  .avatar-border { width: 54px; height: 54px; border-radius: 4px; border: 2px solid #3ecf5a; padding: 2px; box-sizing: border-box; }
  .avatar-border img { width: 100%; height: 100%; border-radius: 2px; object-fit: cover; display: block; }
  .online-dot { position: absolute; bottom: 2px; right: 2px; width: 11px; height: 11px; background: #3ecf5a; border-radius: 50%; border: 2px solid #1a2433; }
</style>
</head>
