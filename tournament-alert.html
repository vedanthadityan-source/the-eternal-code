<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #1a2433;
    font-family: Georgia, serif;
    color: #d8eaf4;
    overflow: hidden;
  }

  #alert { display: none; padding: 10px 12px; }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px solid #2a3d52;
  }

  @keyframes flash-bolt { 0%,100%{opacity:1} 50%{opacity:0.2} }
  @keyframes live-blink  { 0%,100%{opacity:1} 50%{opacity:0.1} }
  @keyframes pulse-border {
    0%  { opacity:0.9; transform:scale(1); }
    70% { opacity:0;   transform:scale(1.03); }
    100%{ opacity:0;   transform:scale(1.03); }
  }

  .bolt  { font-size:12px; animation: flash-bolt 1.2s ease-in-out infinite; }
  .label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:#e8843a; }
  .dot   { width:7px; height:7px; background:#e03030; border-radius:50%;
           display:inline-block; animation:live-blink 1s ease-in-out infinite; }

  .msg {
    font-size: 11px;
    color: #d8eaf4;
    line-height: 1.45;
    margin-bottom: 8px;
    font-style: italic;
    text-align: center;
  }

  .msg strong { color:#e8843a; font-style:normal; }

  .btn {
    display: block;
    padding: 6px 10px;
    background: rgba(232,132,58,0.12);
    border: 1px solid rgba(232,132,58,0.45);
    border-radius: 4px;
    color: #e8843a;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    font-family: Georgia, serif;
    text-align: center;
  }

  #inactive {
    display: none;
    padding: 8px 2px;
    font-size: 11px;
    color: #7a9aaa;
    font-style: italic;
    text-align: center;
  }
</style>
</head>
<body>

<div id="alert">
  <div class="top-row">
    <span class="bolt">⚡</span>
    <span class="label" id="lbl">Tournament Alert</span>
    <span class="dot"></span>
  </div>
  <div class="msg" id="msg"></div>
  <a class="btn" id="btn" href="#" target="_blank" rel="noopener">♟ Join the Tournament →</a>
</div>

<div id="inactive">No active tournament right now.</div>

<script>
const URL = 'https://vedanthadityan-source.github.io/the-eternal-code/tournament.json';

async function load() {
  try {
    const res  = await fetch(URL + '?v=' + Date.now());
    const data = await res.json();
    if (data.active) {
      document.getElementById('lbl').textContent  = data.type || 'Tournament Alert';
      document.getElementById('msg').innerHTML    = data.message || '';
      document.getElementById('btn').href         = data.url || '#';
      document.getElementById('alert').style.display = 'block';
    } else {
      document.getElementById('inactive').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('inactive').style.display = 'block';
  }
}
load();
</script>
</body>
</html>
