<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a2433; font-family: Georgia, serif; overflow: hidden; }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 4px 0; }
  .avatar-link { display: block; text-decoration: none; }
  .avatar-border {
    width: 72px; height: 72px; border-radius: 6px;
    border: 2px solid #e8c84a; padding: 3px;
    box-sizing: border-box; margin: 0 auto 8px;
  }
  .avatar-border img {
    width: 100%; height: 100%; border-radius: 4px;
    object-fit: cover; display: block;
  }
  .name-link {
    display: block; text-decoration: none;
    font-size: 16px; color: #e8c84a;
    font-style: italic; font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(232,200,74,0.5);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="avatar-link" href="https://www.chess.com/member/commandocastler" target="_blank" rel="noopener">
    <div class="avatar-border">
      <img src="https://images.chesscomfiles.com/uploads/v1/user/482511899.34aba4fa.50x50o.abb6801b96cb.jpg" />
    </div>
  </a>
  <a class="name-link" href="https://www.chess.com/member/commandocastler" target="_blank" rel="noopener">
    CommandoCastler
  </a>
</div>
</body>
</html>
