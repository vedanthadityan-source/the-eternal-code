<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e1c17; font-family: Georgia, serif; color: #c8ece4; padding: 16px 18px; }

  .top-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .count-num { font-size: 32px; font-weight: 800; color: #c8ece4; letter-spacing: -0.5px; }
  .count-word { font-size: 14px; color: #4a8c7c; font-weight: 400; }

  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .prog-label { font-size: 12px; color: #4a8c7c; }
  .prog-range { font-size: 12px; color: #2a9d82; }
  .prog-range span { color: #5ee8c0; font-weight: 600; }

  .bar-wrap { width: 100%; height: 6px; background: #1a4a3a; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .bar-fill { height: 100%; background: #5ee8c0; border-radius: 3px; }

  .bar-labels { display: flex; justify-content: space-between; }
  .bar-lbl { font-size: 11px; color: #4a8c7c; }

  .loading { font-size: 12px; color: #4a8c7c; font-style: italic; padding: 10px 0; }
  .error { font-size: 12px; color: #4a8c7c; font-style: italic; padding: 10px 0; }
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>

<script>
async function run() {
  const root = document.getElementById('root');
  try {
    const res = await fetch('https://api.chess.com/pub/club/schizzarotto-fan-club');
    const data = await res.json();
    const count = data.members_count || 0;

    const STEP = 500;
    const low = Math.floor(count / STEP) * STEP;
    const high = low + STEP;
    const pct = Math.min(100, Math.round(((count - low) / STEP) * 100));

    root.innerHTML = `
      <div class="top-row">
        <span class="count-num">${count.toLocaleString()}</span>
        <span class="count-word">Members</span>
      </div>
      <div class="progress-header">
        <span class="prog-label">Progress</span>
        <span class="prog-range">${low.toLocaleString()} &rarr; <span>${high.toLocaleString()}</span></span>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="bar-labels">
        <span class="bar-lbl">${low.toLocaleString()}</span>
        <span class="bar-lbl">${high.toLocaleString()}</span>
      </div>
    `;
  } catch(e) {
    root.innerHTML = '<div class="error">Could not load member count.</div>';
  }
}
run();
</script>
</body>
</html>
