<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Eternal – Birthdays</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a2433;
    color: #d8eaf4;
    font-family: Georgia, serif;
    font-size: 12px;
    padding: 10px;
  }

  .header {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a9aaa;
    margin-bottom: 10px;
    border-bottom: 1px solid #2a3d52;
    padding-bottom: 7px;
  }

  .row {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }

  input, select {
    background: #111820;
    border: 1px solid #2a3d52;
    color: #d8eaf4;
    padding: 5px 7px;
    font-size: 12px;
    border-radius: 3px;
    font-family: Georgia, serif;
    outline: none;
    width: 100%;
  }

  select { padding: 5px 2px; }

  .btn {
    width: 100%;
    background: linear-gradient(135deg, #2a6090, #1a4060);
    color: #d8eaf4;
    border: 1px solid #4a88b8;
    padding: 7px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    font-family: Georgia, serif;
    margin-bottom: 6px;
  }

  .btn:hover {
    background: linear-gradient(135deg, #3a70a0, #2a5070);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .confirm {
    font-size: 11px;
    color: #5ab870;
    text-align: center;
    margin-bottom: 6px;
    display: none;
  }

  .error-msg {
    font-size: 11px;
    color: #e8843a;
    text-align: center;
    margin-bottom: 6px;
    display: none;
  }

  .list-wrap {
    max-height: 320px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .list-wrap::-webkit-scrollbar {
    width: 6px;
  }

  .list-wrap::-webkit-scrollbar-track {
    background: #111820;
  }

  .list-wrap::-webkit-scrollbar-thumb {
    background: #2a3d52;
    border-radius: 3px;
  }

  .list-wrap::-webkit-scrollbar-thumb:hover {
    background: #4a88b8;
  }

  .entry {
    padding: 6px 8px;
    margin-bottom: 4px;
    background: #111820;
    border-left: 2px solid #4a88b8;
    border-radius: 2px;
    font-size: 12px;
    color: #d8eaf4;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .entry-info {
    flex: 1;
    min-width: 0;
  }

  .entry-name {
    font-weight: bold;
    color: #d8eaf4;
  }

  .entry-name-link {
    font-weight: bold;
    color: #d8eaf4;
    text-decoration: none;
  }

  .entry-name-link:hover {
    color: #9ec8e3;
    text-decoration: underline;
  }

  .entry-note {
    color: #9ab8cc;
    font-size: 11px;
  }

  .entry-date {
    font-size: 11px;
    color: #7a9aaa;
    margin-top: 2px;
  }

  .empty {
    font-size: 12px;
    color: #7a9aaa;
    text-align: center;
    padding: 6px;
    font-style: italic;
  }

  .loading {
    font-size: 11px;
    color: #7a9aaa;
    text-align: center;
    padding: 6px;
  }

  .credits {
    margin-top: 8px;
    font-size: 10px;
    color: #7a9aaa;
    text-align: center;
  }

  .credits a {
    color: #7a9aaa;
  }

  .today-badge {
    color: #5ab870;
    font-weight: bold;
  }

  .soon-badge {
    color: #e8843a;
  }
</style>
</head>
<body>
<div class="header">🎂 Next Birthdays</div>

<div class="row">
  <input id="bd-name" placeholder="Username" style="flex:2;" />
  <select id="bd-month" style="flex:1;" onchange="buildDays()">
    <option value="">Mo</option>
    <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
    <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
    <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
  </select>
  <select id="bd-day" style="flex:1;">
    <option value="">Day</option>
  </select>
</div>

<input id="bd-profile" placeholder="Profile URL (optional)" style="margin-bottom:6px;" />
<input id="bd-note" placeholder="Note (optional)" style="margin-bottom:6px;" />
<button class="btn" id="save-btn" onclick="saveBirthday()">Save Birthday</button>

<div class="confirm" id="bd-confirm">✅ Saved!</div>
<div class="error-msg" id="bd-error">❌ Error saving. Try again.</div>

<div class="list-wrap">
  <div class="list" id="bd-list">
    <div class="loading">Loading birthdays…</div>
  </div>
</div>

<div class="credits">
  Credits to <a href="https://www.chess.com/member/takieddinegoumri" target="_blank" rel="noopener noreferrer">TakieddineGOUMRI</a> for the idea
</div>

<script>
const BIN_ID  = '69ae775943b1c97be9c3be1f';
const API_KEY = '$2a$10$Kk8Vd5sedpfuNMV9zDuWveDoizeE6i3TpoXTbBfmA2VR9ZkpcMnB.';
const BASE    = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
const MN      = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DIMS    = [31,29,31,30,31,30,31,31,30,31,30,31];

function buildDays() {
  var m = parseInt(document.getElementById('bd-month').value);
  var sel = document.getElementById('bd-day');
  while (sel.options.length) sel.remove(0);
  var o = document.createElement('option');
  o.value = '';
  o.textContent = 'Day';
  sel.appendChild(o);
  if (m > 0) {
    for (var i = 1; i <= DIMS[m - 1]; i++) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      sel.appendChild(opt);
    }
  }
}

function daysUntil(m, d) {
  var now = new Date();
  var y = now.getFullYear();
  var t = new Date(y, m - 1, d);
  if (t - now < -86400000) t = new Date(y + 1, m - 1, d);
  return Math.round((t - now) / 86400000);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderList(entries) {
  var list = document.getElementById('bd-list');
  list.innerHTML = '';

  if (!entries || entries.length === 0) {
    list.innerHTML = '<div class="empty">No birthdays saved yet</div>';
    return;
  }

  var sorted = entries.slice().sort(function(a, b) {
    return daysUntil(a.m, a.d) - daysUntil(b.m, b.d);
  });

  sorted.forEach(function(entry) {
    var days = daysUntil(entry.m, entry.d);
    var lbl = days === 0
      ? '<span class="today-badge">🎂 Today!</span>'
      : days <= 7
        ? '<span class="soon-badge">in ' + days + ' day' + (days === 1 ? '' : 's') + '</span>'
        : 'in ' + days + ' day' + (days === 1 ? '' : 's');

    var profile = entry.p ? escHtml(entry.p) : '';
    var nameHtml = profile
      ? '<a class="entry-name-link" href="' + profile + '" target="_blank" rel="noopener noreferrer">' + escHtml(entry.n) + '</a>'
      : '<span class="entry-name">' + escHtml(entry.n) + '</span>';

    var div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML =
      '<div class="entry-info">' +
        nameHtml +
        (entry.nt ? ' <span class="entry-note">· ' + escHtml(entry.nt) + '</span>' : '') +
        '<div class="entry-date">' + MN[entry.m - 1] + ' ' + entry.d + ' &nbsp;·&nbsp; ' + lbl + '</div>' +
      '</div>';

    list.appendChild(div);
  });
}

async function getEntries() {
  var res = await fetch(BASE + '/latest', {
    headers: { 'X-Master-Key': API_KEY }
  });
  var data = await res.json();
  return (data.record && data.record.entries) ? data.record.entries : [];
}

async function setEntries(entries) {
  await fetch(BASE, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify({ entries: entries })
  });
}

async function loadBirthdays() {
  try {
    renderList(await getEntries());
  } catch (e) {
    document.getElementById('bd-list').innerHTML = '<div class="empty">Could not load birthdays.</div>';
  }
}

async function saveBirthday() {
  var n = document.getElementById('bd-name').value.trim();
  var m = parseInt(document.getElementById('bd-month').value);
  var d = parseInt(document.getElementById('bd-day').value);
  var p = document.getElementById('bd-profile').value.trim();
  var nt = document.getElementById('bd-note').value.trim();

  if (!n || !m || !d) return;

  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  document.getElementById('bd-error').style.display = 'none';

  try {
    var entries = await getEntries();
    entries.push({
      id: Date.now().toString(),
      n: n,
      m: m,
      d: d,
      p: p,
      nt: nt
    });
    await setEntries(entries);

    document.getElementById('bd-name').value = '';
    document.getElementById('bd-profile').value = '';
    document.getElementById('bd-note').value = '';
    document.getElementById('bd-month').value = '';
    document.getElementById('bd-day').innerHTML = '<option value="">Day</option>';
    buildDays();

    var c = document.getElementById('bd-confirm');
    c.style.display = 'block';
    setTimeout(function() {
      c.style.display = 'none';
    }, 2500);

    renderList(entries);
  } catch (e) {
    var er = document.getElementById('bd-error');
    er.style.display = 'block';
    setTimeout(function() {
      er.style.display = 'none';
    }, 3000);
  }

  btn.disabled = false;
  btn.textContent = 'Save Birthday';
}

loadBirthdays();
</script>
</body>
</html>
