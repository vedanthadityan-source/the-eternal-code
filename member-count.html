<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a2433; font-family: Georgia, serif; color: #d8eaf4; overflow: hidden; }
  #top { margin-bottom: 10px; }
  #count { font-size: 26px; font-weight: bold; color: #d8eaf4; }
  #mlabel { font-size: 13px; color: #9ab8cc; margin-left: 6px; }
  #prow { display: flex; justify-content: space-between; font-size: 11px; color: #9ab8cc; margin-bottom: 5px; }
  #low { color: #6aacda; }
  #high { color: #5ab870; }
  #barbg { background: #17202d; border-radius: 3px; height: 6px; margin-bottom: 4px; }
  #bar { width: 0%; height: 100%; background: linear-gradient(90deg,#2a6090,#5090b8); border-radius: 3px; transition: width 0.8s ease; }
  #lbls { display: flex; justify-content: space-between; font-size: 10px; color: #7a9aaa; }
</style>
</head>
<body>
<div id="top"><span id="count">…</span><span id="mlabel">Members</span></div>
<div id="prow"><span>Progress</span><span><span id="low">—</span> &rarr; <span id="high">—</span></span></div>
<div id="barbg"><div id="bar"></div></div>
<div id="lbls"><span id="ll">—</span><span id="lh">—</span></div>
<script>
  var ms = [100,200,300,400,500,600,700,800,900,1000,1500,2000,2500,3000,4000,5000,10000];
  fetch('https://api.chess.com/pub/club/the-eternal/members')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var n = 0;
      if(data.weekly) n += data.weekly.length;
      if(data.monthly) n += data.monthly.length;
      if(data.all_time) n += data.all_time.length;
      // Find the range: low is the last milestone strictly less than n,
      // high is the first milestone >= n (so hitting 500 moves to 500-600)
      var low = 0, high = ms[ms.length - 1];
      for(var i = 0; i < ms.length; i++){
        if(ms[i] < n) low = ms[i];
        if(ms[i] >= n){ high = ms[i]; break; }
      }
      // If n exactly equals a milestone, step forward so range is that milestone to next
      if(n === high && i + 1 < ms.length){
        low = high;
        high = ms[i + 1];
      }
      var pct = high > low ? Math.round(((n - low) / (high - low)) * 100) : 100;
      document.getElementById('count').textContent = n;
      document.getElementById('low').textContent = low;
      document.getElementById('high').textContent = high;
      document.getElementById('ll').textContent = low;
      document.getElementById('lh').textContent = high;
      document.getElementById('bar').style.width = pct + '%';
    })
    .catch(function(){ document.getElementById('count').textContent = '—'; });
</script>
</body>
</html>
