<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #101820 !important;      /* general dark background */
    background-color: #101820 !important;
    font-family: Georgia, serif;
    color: #dfeff4;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  /* main card background close to club sidebar tone */
  .member-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: #173337;                 /* teal‑green panel */
    border-left: 2px solid #33b0a6;      /* accent like link color */
    margin-bottom: 6px;
    position: relative;
  }

  .member-card:last-child {
    margin-bottom: 0;
  }

  .member-card:first-child {
    border-left: 2px solid #f2a65a;
  }

  .member-card:first-child .rank-badge {
    background: rgba(242,166,90,0.15);
    color: #f2c791;
    border: 1px solid rgba(242,166,90,0.4);
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid #28454a;
    object-fit: cover;
    display: block;
    background: #173337;
  }

  .member-card:first-child .avatar {
    border-color: #f2a65a;
    width: 44px;
    height: 44px;
  }

  .new-badge {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 12px;
    height: 12px;
    background: #4caf50;
    border-radius: 50%;
    border: 1.5px solid #101820;
    animation: pulse-green 2s ease-in-out infinite;
  }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .username-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }

  .username {
    font-size: 13px;
    font-weight: 600;
    color: #f5f8fa;
    font-family: 'Courier New', courier;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-decoration: none;
    display: block;
  }

  .member-card:first-child .username {
    color: #ffe2b5;
    font-size: 13px;
  }

  .username:hover { color: #33b0a6; }

  .rank-badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #9fd7d1;
    background: rgba(51,176,166,0.18);
    border: 1px solid rgba(51,176,166,0.4);
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rating-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #122629;
    border: 1px solid #28454a;
    border-radius: 3px;
    padding: 2px 6px;
  }

  .rating-icon {
    font-size: 10px;
  }

  .rating-val {
    font-size: 11px;
    font-weight: bold;
    color: #f2a65a;
    font-family: 'Courier New', courier;
  }

  .rating-label {
    font-size: 9px;
    color: #a5c7c9;
    letter-spacing: 0.5px;
  }

  .skeleton {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: #173337;
    border-left: 2px solid #28454a;
    margin-bottom: 6px;
    opacity: 0.5;
    animation: shimmer 1.5s ease-in-out infinite;
  }

  .skeleton:last-child { margin-bottom: 0; }

  .skel-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #28454a;
    flex-shrink: 0;
  }

  .skel-lines { flex: 1; }

  .skel-line {
    height: 9px;
    background: #28454a;
    border-radius: 3px;
    margin-bottom: 6px;
  }

  .skel-line.short { width: 55%; }
  .skel-line.long  { width: 80%; }

  @keyframes shimmer {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 0.7; }
  }

  .error-msg {
    font-size: 11px;
    color: #b0d1d4;
    font-style: italic;
    padding: 6px 2px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="root">
  <!-- skeletons unchanged -->
</div>

<script>
const CLUB  = 'alien-chess-hub';
const API   = 'https://api.chess.com/pub';
const COUNT = 4;

const RATING_KEYS = [
  ['chess_blitz',  '⚡', 'Blitz'],
  ['chess_rapid',  '🕐', 'Rapid'],
  ['chess_bullet', '🚀', 'Bullet'],
];

const RANK_LABELS = ['Newest', '2nd', '3rd', '4th'];

function getBestRating(stats) {
  let best = 0, icon = '♟', label = '';
  for (const [key, ic, lbl] of RATING_KEYS) {
    const val = stats?.[key]?.last?.rating || stats?.[key]?.best?.rating || 0;
    if (val > best) { best = val; icon = ic; label = lbl; }
  }
  return best ? { value: best, icon, label } : null;
}

async function load() {
  const root = document.getElementById('root');
  try {
    const res  = await fetch(`${API}/club/${CLUB}/members`);
    const data = await res.json();

    const all = [
      ...(data.weekly   || []),
      ...(data.monthly  || []),
      ...(data.all_time || []),
    ];

    if (!all.length) throw new Error('No members');

    const seen = new Set();
    const unique = all.filter(m => {
      if (seen.has(m.username)) return false;
      seen.add(m.username);
      return true;
    });

    unique.sort((a, b) => (b.joined || 0) - (a.joined || 0));
    const newest = unique.slice(0, COUNT);

    const details = await Promise.all(newest.map(async (m, i) => {
      try {
        const [pRes, sRes] = await Promise.all([
          fetch(`${API}/player/${m.username}`),
          fetch(`${API}/player/${m.username}/stats`),
        ]);
        const profile = await pRes.json();
        const stats   = await sRes.json();
        return { username: m.username, profile, stats, rank: i };
      } catch {
        return { username: m.username, profile: {}, stats: {}, rank: i };
      }
    }));

    root.innerHTML = details.map(({ username, profile, stats, rank }) => {
      const avatar  = profile.avatar || '';
      const rating  = getBestRating(stats);
      const url     = `https://www.chess.com/member/${username}`;
      const imgTag  = avatar
        ? `<img class="avatar" src="${avatar}" alt="${username}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
           <div class="avatar" style="display:none;align-items:center;justify-content:center;font-size:18px;color:#9fd7d1;">♟</div>`
        : `<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px;color:#9fd7d1;">♟</div>`;

      return `
        <div class="member-card">
          <div class="avatar-wrap">
            ${imgTag}
            ${rank === 0 ? '<div class="new-badge"></div>' : ''}
          </div>
          <div class="info">
            <div class="username-row">
              <a class="username" href="${url}" target="_blank" rel="noopener noreferrer">${username}</a>
            </div>
            <div class="stats-row">
              ${
                rating
                  ? `
                <div class="rating-pill">
                  <span class="rating-icon">${rating.icon}</span>
                  <span class="rating-val">${rating.value}</span>
                  <span class="rating-label">${rating.label}</span>
                </div>`
                  : `<span class="rating-label" style="font-style:italic;">Unrated</span>`
              }
            </div>
          </div>
        </div>
      `;
    }).join('');

  } catch (e) {
    root.innerHTML = `<div class="error-msg">Could not load member data.</div>`;
    console.error(e);
  }
}

load();
</script>
</body>
</html>
